# Optional local PostgreSQL. API, worker and web run via scripts/dev.py.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentpro
      POSTGRES_USER: dentpro
      POSTGRES_PASSWORD: dentpro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dentpro-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentpro"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  dentpro-db:
