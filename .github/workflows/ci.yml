name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r services/api/requirements.lock.txt
      - run: PYTHONPATH=services/api python -m pytest services/api/tests -q
      - run: npm ci --workspaces --include-workspace-root
        working-directory: ${{ github.workspace }}
      - run: npm run typecheck
        working-directory: ${{ github.workspace }}
      - run: npm run test:maps-embed
        working-directory: ${{ github.workspace }}
      - run: npm run build
        working-directory: ${{ github.workspace }}
      - run: npm run mobile:typecheck
        working-directory: ${{ github.workspace }}
      - run: npm run mobile:lint
        working-directory: ${{ github.workspace }}
      - run: npm run mobile:test
        working-directory: ${{ github.workspace }}
      - run: npm run mobile:export
        working-directory: ${{ github.workspace }}
