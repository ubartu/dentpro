name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r services/api/requirements.lock.txt
      - run: PYTHONPATH=services/api python -m pytest services/api/tests -q
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run mobile:typecheck
      - run: npm run mobile:lint
      - run: npm run mobile:test
      - run: npm run mobile:export
